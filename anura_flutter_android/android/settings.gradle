rootProject.name = 'anura_flutter_android'

plugins {
    id "com.android.library" version "7.3.0" apply false
    id "org.jetbrains.kotlin.android" version "1.8.0" apply false
}

dependencyResolutionManagement {
    repositories {
        maven {
            url = uri("https://git.deepaffex.ai/api/packages/External/maven")// Use the actual URL of the Anura Maven repo
            credentials {
                username = System.getenv("DFX_GIT_USERNAME")
                password = System.getenv("DFX_GIT_TOKEN")
            }
        }
        google()
        mavenCentral()
    }
}