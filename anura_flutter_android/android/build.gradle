plugins {
    id "com.android.library"
    id "kotlin-android"
}

ext {
    kotlinXJsonSerialization = '1.1.0'
    kotlinxCoroutinesVersion = '1.3.9'
    websocketVersion = '1.4.1'
    androidxActivityVersion = '1.7.2'
    androidxFragmentVersion = '1.6.0'
    androidxAppCompatVersion = '1.6.1'
    androidxConstraintlayoutVersion = '2.1.4'
    androidxRecyclerviewVersion = '1.3.0'
    gsonVersion = '2.9.0'
    materialVersion = '1.9.0'
    anurasdkVersion = '2.4.10.103'
    dfxVersion = '4.14.11'
    dfxExtrasVersion = '0.1.9'
    opencvVersion = '4.12.0'
    mediaPipeVersion = "0.10.26-29"
}


group 'com.example.verygoodcore'
version '1.0-SNAPSHOT'

allprojects {
    repositories {
        maven {
            url = uri("https://git.deepaffex.ai/api/packages/External/maven")// Use the actual URL of the Anura Maven repo
            credentials {
                username = System.getenv("DFX_GIT_USERNAME")
                password = System.getenv("DFX_GIT_TOKEN")
            }
        }
        google()
        mavenCentral()
    }
}

rootProject.allprojects {
    repositories {
        maven {
            url = uri("https://git.deepaffex.ai/api/packages/External/maven")// Use the actual URL of the Anura Maven repo
            credentials {
                username = System.getenv("DFX_GIT_USERNAME")
                password = System.getenv("DFX_GIT_TOKEN")
            }
        }
        google()
        mavenCentral()
    }
}

android {
    if (project.android.hasProperty("namespace")) {
        namespace 'com.example.verygoodcore'
    }

    compileSdk 36

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    packagingOptions {
        jniLibs {
            pickFirsts += ['lib/arm64-v8a/libc++_shared.so']
        }
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
        test.java.srcDirs += 'src/test/kotlin'
    }

    defaultConfig {
        minSdkVersion 25

        def DFX_REST_URL = ""
        def DFX_WS_URL = ""
        def DFX_LICENSE_KEY = ""
        def DFX_STUDY_ID = ""

        if (file('server.properties').exists()) {
            Properties properties = new Properties()
            properties.load(file('server.properties').newDataInputStream())

            DFX_REST_URL = properties.getProperty("DFX_REST_URL")
            DFX_WS_URL = properties.getProperty("DFX_WS_URL")
            DFX_LICENSE_KEY = properties.getProperty("DFX_LICENSE_KEY")
            DFX_STUDY_ID = properties.getProperty("DFX_STUDY_ID")
        }

        buildConfigField 'String', 'DFX_REST_URL', "\"${DFX_REST_URL}\""
        buildConfigField 'String', 'DFX_WS_URL', "\"${DFX_WS_URL}\""
        buildConfigField 'String', 'DFX_LICENSE_KEY', "\"${DFX_LICENSE_KEY}\""
        buildConfigField 'String', 'DFX_STUDY_ID', "\"${DFX_STUDY_ID}\""

    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }

      

    dependencies {
        testImplementation 'org.jetbrains.kotlin:kotlin-test'
        testImplementation 'org.mockito:mockito-core:5.0.0'

        // Anura Core SDK
        implementation "ai.nuralogix:anurasdk:${anurasdkVersion}@aar"
        implementation "ai.nuralogix.dfx:dfxsdk:${dfxVersion}"
        implementation "ai.nuralogix.dfx.extras:dfxextras:${dfxExtrasVersion}"
        implementation "ai.nuralogix:mediapipe-facemesh-android:${mediaPipeVersion}"
        implementation "ai.nuralogix:anura-opencv:${opencvVersion}"

        // Anura Core SDK Dependencies
        implementation "org.jetbrains.kotlinx:kotlinx-serialization-json:$kotlinXJsonSerialization"
        implementation "com.google.code.gson:gson:$gsonVersion"
        implementation "org.java-websocket:Java-WebSocket:$websocketVersion"

        // Anura Sample App Dependencies
        implementation "androidx.constraintlayout:constraintlayout:$androidxConstraintlayoutVersion"
        implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
        implementation "com.google.android.material:material:$materialVersion"
        implementation "androidx.activity:activity-ktx:$androidxActivityVersion"
        implementation "androidx.fragment:fragment-ktx:$androidxFragmentVersion"
        implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:$kotlinxCoroutinesVersion"
        implementation "androidx.recyclerview:recyclerview:$androidxRecyclerviewVersion"


    }


    testOptions {
        unitTests.all {
            useJUnitPlatform()

            testLogging {
               events "passed", "skipped", "failed", "standardOut", "standardError"
               outputs.upToDateWhen {false}
               showStandardStreams = true
            }
        }
    }
}